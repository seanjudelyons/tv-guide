name: Build TV guide

on:
  schedule:
    # Every 30 minutes. Most runs are "quick" (re-read the two Australian sources, about 5 seconds); a "full" run
    # (all sources + new Pluto links) happens when the last one is over 5.5 hours old. See the "Full or quick" step.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Fail on purpose to test the alert email"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: guide
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulated failure (alert test only)
        if: ${{ inputs.simulate_failure }}
        run: exit 1
      - name: Full or quick run?
        id: mode
        env:
          RAW: https://raw.githubusercontent.com/${{ github.repository }}/guide
        run: |
          # Pushes and manual runs are always full. A scheduled run is quick unless the last full run is over
          # 5.5 hours old; pluto.json is only rewritten by full runs, so its age is the age of the last full run.
          mode=full
          if [ "${{ github.event_name }}" = "schedule" ] && curl -fsSL --retry 3 -o /tmp/pluto_prev.json "$RAW/pluto.json"; then
            age=$(python3 -c "import json,time; print(int(time.time()-json.load(open('/tmp/pluto_prev.json'))['generated']))" || echo 999999)
            if [ "$age" -lt 19800 ]; then mode=fast; fi
            echo "last full run: ${age}s ago"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "mode: $mode"
      - name: Merge guides
        run: python3 merge_guide.py /tmp/guide.xml.gz ${{ steps.mode.outputs.mode == 'fast' && '--fast' || '' }}
      - name: Small JSON guide for the Samsung TV app
        run: python3 lite_guide.py /tmp/guide.xml.gz /tmp/guide.json
      - name: Pluto TV stream links for the Samsung TV app (quick runs keep the last full run's links)
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "fast" ]; then cp /tmp/pluto_prev.json /tmp/pluto.json
          else python3 pluto_links.py /tmp/pluto.json; fi
      - name: Publish to the guide branch (history overwritten each run, so the repo stays small)
        run: |
          mkdir /tmp/out && cp /tmp/guide.xml.gz /tmp/guide.json /tmp/pluto.json /tmp/ids.json /tmp/out/ && cd /tmp/out
          git init -q -b guide
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add guide.xml.gz guide.json pluto.json ids.json
          git commit -q -m "Guide $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" guide
      - name: Keep the schedule enabled (GitHub pauses idle schedules after 60 days)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/guide.yml/enable" || true

      # Alerting: a new issue emails the repo owner. One open issue at a time; closed automatically on recovery.
      - name: Open an alert issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list -R "${{ github.repository }}" --label tv-alert --state open --json number --jq '.[0].number')
          gh label create tv-alert -R "${{ github.repository }}" --color d73a4a --description "TV guide build failures" 2>/dev/null || true
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "${{ github.repository }}" --body "@${{ github.repository_owner }} still failing: $RUN_URL"
          else
            gh issue create -R "${{ github.repository }}" --label tv-alert \
              --title "TV guide build failed" \
              --body "@${{ github.repository_owner }} the scheduled TV guide build failed, so the TV guide / Pluto links may go stale.

          Run: $RUN_URL

          See docs in the tv-project folder (OPERATIONS.md → Troubleshooting). This issue closes itself when a later run succeeds."
          fi
      - name: Close alert issues on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list -R "${{ github.repository }}" --label tv-alert --state open --json number --jq '.[].number'); do
            gh issue close "$n" -R "${{ github.repository }}" --comment "Recovered: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
